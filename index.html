<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>German Theological Vocabulary (Advanced 1001–1200)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        .perspective { perspective: 1000px; }
        .transform-style { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans" x-data="vocabApp()" x-init="initData()">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 py-6 px-4 sm:px-8 shadow-md">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <span class="text-xs uppercase tracking-widest text-amber-400 font-semibold">TerraNova Engineering Lab</span>
                <h1 class="text-2xl sm:text-3xl font-bold text-white mt-1">Advanced Theological Vocabulary (1001–1200)</h1>
                <div class="flex items-center gap-3 mt-1">
                    <p class="text-slate-400 text-sm">High-level theological terminology and interactive study.</p>
                    <span class="text-xs px-2.5 py-0.5 rounded bg-slate-900 border border-slate-700 text-amber-300 font-mono" x-text="'Source: ' + dataSource"></span>
                </div>
            </div>
            <!-- View Mode Switcher -->
            <div class="flex flex-wrap bg-slate-900 p-1 rounded-lg border border-slate-700">
                <button @click="viewMode = 'list'" :class="viewMode === 'list' ? 'bg-amber-600 text-white' : 'text-slate-400 hover:text-white'" class="px-3 py-2 rounded-md text-sm font-medium transition">List View</button>
                <button @click="viewMode = 'cards'" :class="viewMode === 'cards' ? 'bg-amber-600 text-white' : 'text-slate-400 hover:text-white'" class="px-3 py-2 rounded-md text-sm font-medium transition">Flashcards</button>
                <button @click="viewMode = 'memory'; initMemoryGame()" :class="viewMode === 'memory' ? 'bg-amber-600 text-white' : 'text-slate-400 hover:text-white'" class="px-3 py-2 rounded-md text-sm font-medium transition">Memory Match</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 sm:px-8 py-8">

        <!-- Controls: Search & Filters -->
        <div class="flex flex-col md:flex-row gap-4 mb-8" x-show="viewMode !== 'memory'">
            <!-- Search Bar -->
            <div class="relative flex-1">
                <input type="text" x-model="searchQuery" placeholder="Search German term, English meaning, or number..." 
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 pl-10 text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 transition">
                <svg class="w-5 h-5 text-slate-500 absolute left-3 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            <!-- Section Filter -->
            <div class="md:w-72">
                <select x-model="selectedSection" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-amber-500 transition">
                    <option value="all">All Sections</option>
                    <template x-for="sec in sections" :key="sec.id">
                        <option :value="sec.id" x-text="sec.name"></option>
                    </template>
                </select>
            </div>
        </div>

        <!-- LIST VIEW -->
        <div x-show="viewMode === 'list'" class="space-y-8">
            <template x-for="sec in filteredSections" :key="sec.id">
                <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-6 shadow-lg">
                    <h2 class="text-xl font-bold text-amber-400 mb-4 pb-2 border-b border-slate-700" x-text="sec.name"></h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        <template x-for="item in sec.words" :key="item.num">
                            <div class="bg-slate-900 border border-slate-800 rounded-lg p-4 hover:border-slate-600 transition flex flex-col justify-between">
                                <div>
                                    <div class="flex justify-between items-start mb-2">
                                        <span class="text-xs font-mono text-slate-500" x-text="'#' + item.num"></span>
                                        <span class="text-xs px-2 py-0.5 rounded bg-slate-800 text-amber-300 font-medium" x-text="item.type"></span>
                                    </div>
                                    <h3 class="text-lg font-bold text-white mb-1" x-text="item.german"></h3>
                                    <p class="text-slate-300 text-sm" x-text="item.meaning"></p>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>

        <!-- FLASHCARD VIEW -->
        <div x-show="viewMode === 'cards'" class="max-w-xl mx-auto">
            <div class="text-center mb-4 text-sm text-slate-400">
                Card <span x-text="currentCardIndex + 1"></span> of <span x-text="totalFilteredWords"></span>
            </div>

            <!-- Flashcard Component -->
            <div class="perspective h-80 w-full cursor-pointer mb-6" @click="flipped = !flipped">
                <div class="relative w-full h-full duration-500 transform-style shadow-2xl rounded-2xl" :class="flipped ? 'rotate-y-180' : ''">
                    <!-- Front (German) -->
                    <div class="absolute inset-0 w-full h-full bg-slate-800 border-2 border-slate-700 rounded-2xl flex flex-col items-center justify-center p-8 backface-hidden text-center">
                        <span class="absolute top-4 left-4 text-xs font-mono text-amber-400" x-text="'#' + currentWord.num"></span>
                        <span class="text-xs uppercase tracking-wider text-slate-500 mb-2" x-text="currentWord.sectionName"></span>
                        <h2 class="text-3xl font-extrabold text-white mb-3" x-text="currentWord.german"></h2>
                        <span class="absolute bottom-4 text-xs text-slate-500">Click to flip</span>
                    </div>
                    <!-- Back (Meaning) -->
                    <div class="absolute inset-0 w-full h-full bg-slate-800 border-2 border-amber-600/50 rounded-2xl flex flex-col items-center justify-center p-8 backface-hidden rotate-y-180 text-center">
                        <span class="absolute top-4 left-4 text-xs font-mono text-amber-400" x-text="'#' + currentWord.num"></span>
                        <span class="text-xs uppercase tracking-wider text-amber-400 mb-2">Meaning</span>
                        <h3 class="text-2xl font-bold text-white mb-2" x-text="currentWord.meaning"></h3>
                        <span class="text-xs px-2.5 py-1 rounded bg-slate-900 text-slate-300 font-medium mt-2" x-text="currentWord.type"></span>
                        <span class="absolute bottom-4 text-xs text-slate-500">Click to flip back</span>
                    </div>
                </div>
            </div>

            <!-- Flashcard Navigation Buttons -->
            <div class="flex justify-between items-center gap-4">
                <button @click="prevCard()" class="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 py-3 rounded-lg font-medium transition text-center">Previous</button>
                <button @click="flipped = false; randomCard()" class="bg-amber-600 hover:bg-amber-500 text-white px-6 py-3 rounded-lg font-medium transition">Shuffle</button>
                <button @click="nextCard()" class="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 py-3 rounded-lg font-medium transition text-center">Next</button>
            </div>
        </div>

        <!-- MEMORY MATCH GAME VIEW -->
        <div x-show="viewMode === 'memory'" class="max-w-4xl mx-auto">
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl mb-6 flex flex-wrap justify-between items-center gap-4">
                <div class="flex items-center gap-6">
                    <div>
                        <span class="text-xs text-slate-400 uppercase tracking-wider block">Pairs</span>
                        <span class="text-xl font-bold text-amber-400" x-text="matchedPairs + ' / ' + totalPairs"></span>
                    </div>
                    <div>
                        <span class="text-xs text-slate-400 uppercase tracking-wider block">Moves</span>
                        <span class="text-xl font-bold text-white" x-text="memoryMoves"></span>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <label class="text-sm text-slate-300">Difficulty:</label>
                    <select x-model.number="memoryPairCount" @change="initMemoryGame()" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-amber-500">
                        <option value="6">6 Pairs (12 Cards)</option>
                        <option value="8">8 Pairs (16 Cards)</option>
                        <option value="12">12 Pairs (24 Cards)</option>
                        <option value="16">16 Pairs (32 Cards)</option>
                    </select>
                    <button @click="initMemoryGame()" class="bg-amber-600 hover:bg-amber-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition">New Game</button>
                </div>
            </div>

            <!-- Win Message Banner -->
            <template x-if="matchedPairs === totalPairs && totalPairs > 0">
                <div class="bg-emerald-900/80 border border-emerald-600 text-emerald-100 p-6 rounded-xl text-center mb-6 shadow-lg animate-bounce">
                    <h3 class="text-2xl font-bold mb-1">🎉 Excellent Work!</h3>
                    <p class="text-sm">You successfully matched all vocabulary pairs in <span class="font-bold" x-text="memoryMoves"></span> moves!</p>
                    <button @click="initMemoryGame()" class="mt-4 bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2 rounded-lg font-medium transition shadow">Play Again</button>
                </div>
            </template>

            <!-- Cards Grid -->
            <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-4 lg:grid-cols-6 gap-3">
                <template x-for="card in memoryCards" :key="card.id">
                    <div @click="flipCard(card)" 
                         class="h-28 bg-slate-800 border-2 rounded-xl flex items-center justify-center p-3 text-center cursor-pointer transition transform duration-300 select-none shadow-md"
                         :class="{
                            'border-slate-700 hover:border-amber-500 bg-slate-800': !card.flipped && !card.matched,
                            'border-amber-500 bg-slate-900 text-white scale-105': card.flipped && !card.matched,
                            'border-emerald-600 bg-emerald-950/40 text-emerald-300 opacity-80 cursor-default': card.matched
                         }">
                        <div x-show="!card.flipped && !card.matched" class="text-slate-500 font-bold text-xl">#</div>
                        <div x-show="card.flipped || card.matched" class="text-xs sm:text-sm font-semibold" x-text="card.text"></div>
                    </div>
                </template>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-8 text-xs text-slate-500 border-t border-slate-800 mt-12">
        TerraNova Engineering Lab &bull; German Theological Vocabulary Web App
    </footer>

                },

                formatRawWordsToSections(rawObj) {
                    let wordKeys = Object.keys(rawObj);
                    let chunks = [];
                    for (let i = 0; i < wordKeys.length; i += 25) {
                        let chunkKeys = wordKeys.slice(i, i + 25);
                        let chunkWords = chunkKeys.map(k => ({
                            num: parseInt(k),
                            german: rawObj[k].german,
                            meaning: rawObj[k].english,
                            type: 'Term'
                        }));
                        let startNum = chunkKeys[0];
                        let endNum = chunkKeys[chunkKeys.length - 1];
                        chunks.push({
                            id: 'sec_' + (chunks.length + 1),
                            name: `Section ${chunks.length + 1} (${startNum}–${endNum})`,
                            words: chunkWords
                        });
                    }
                    return chunks;
                },

                get allFlattenedWords() {
                    let list = [];
                    this.sections.forEach(sec => {
                        sec.words.forEach(w => {
                            list.push({ ...w, sectionName: sec.name });
                        });
                    });
                    return list;
                },

                get filteredSections() {
                    let q = this.searchQuery.toLowerCase();
                    return this.sections.map(sec => {
                        let filteredWords = sec.words.filter(w => {
                            let matchesSearch = w.german.toLowerCase().includes(q) || 
                                                w.meaning.toLowerCase().includes(q) || 
                                                w.num.toString().includes(q);
                            let matchesSection = this.selectedSection === 'all' || sec.id === this.selectedSection;
                            return matchesSearch && matchesSection;
                        });
                        return { ...sec, words: filteredWords };
                    }).filter(sec => sec.words.length > 0);
                },

                get filteredWordsList() {
                    let list = [];
                    this.filteredSections.forEach(sec => {
                        sec.words.forEach(w => {
                            list.push({ ...w, sectionName: sec.name });
                        });
                    });
                    return list;
                },

                get totalFilteredWords() {
                    return this.filteredWordsList.length;
                },

                get currentWord() {
                    let list = this.filteredWordsList;
                    if (list.length === 0) return { num: 0, german: 'No words found', meaning: '', type: '', sectionName: '' };
                    if (this.currentCardIndex >= list.length) this.currentCardIndex = 0;
                    return list[this.currentCardIndex];
                },

                nextCard() {
                    this.flipped = false;
                    let len = this.filteredWordsList.length;
                    if (len > 0) this.currentCardIndex = (this.currentCardIndex + 1) % len;
                },

                prevCard() {
                    this.flipped = false;
                    let len = this.filteredWordsList.length;
                    if (len > 0) this.currentCardIndex = (this.currentCardIndex - 1 + len) % len;
                },

                randomCard() {
                    let len = this.filteredWordsList.length;
                    if (len > 1) {
                        let randomIndex;
                        do {
                            randomIndex = Math.floor(Math.random() * len);
                        } while (randomIndex === this.currentCardIndex);
                        this.currentCardIndex = randomIndex;
                    }
                },

                // Memory Match Game Logic
                initMemoryGame() {
                    let allWords = [...this.allFlattenedWords];
                    allWords.sort(() => Math.random() - 0.5);
                    
                    this.totalPairs = Math.min(this.memoryPairCount, allWords.length);
                    let selectedWords = allWords.slice(0, this.totalPairs);

                    let cards = [];
                    selectedWords.forEach((word, index) => {
                        cards.push({
                            id: 'g_' + index,
                            pairId: index,
                            text: word.german,
                            flipped: false,
                            matched: false
                        });
                        cards.push({
                            id: 'm_' + index,
                            pairId: index,
                            text: word.meaning,
                            flipped: false,
                            matched: false
                        });
                    });

                    this.memoryCards = cards.sort(() => Math.random() - 0.5);
                    this.flippedCards = [];
                    this.matchedPairs = 0;
                    this.memoryMoves = 0;
                    this.isChecking = false;
                },

                flipCard(card) {
                    if (this.isChecking || card.flipped || card.matched) return;

                    card.flipped = true;
                    this.flippedCards.push(card);

                    if (this.flippedCards.length === 2) {
                        this.memoryMoves++;
                        this.isChecking = true;
                        let [card1, card2] = this.flippedCards;

                        if (card1.pairId === card2.pairId && card1.id !== card2.id) {
                            card1.matched = true;
                            card2.matched = true;
                            this.matchedPairs++;
                            this.flippedCards = [];
                            this.isChecking = false;
                        } else {
                            setTimeout(() => {
                                card1.flipped = false;
                                card2.flipped = false;
                                this.flippedCards = [];
                                this.isChecking = false;
                            }, 900);
                        }
                    }
                }
            }
        }
